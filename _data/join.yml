kicker: Open positions · 2026/27
heading: Help us define what comes <em>after diffusion</em>.
text: "We are always looking for exceptional PhD students and MSc students interested in generative models,
  geometry, and AI for science. The lab is not hosting interns from outside Imperial over the next year, and
  PhD openings this year are for candidates able to secure funding through competitive scholarship schemes
  (QRT labs, Thomson Reuters, the President's PhD Scholarship, etc.). Imperial PhD applicants: apply through
  the Department of Computing and mention Joey Bose as your preferred supervisor. Please read our
  representative papers before reaching out."
