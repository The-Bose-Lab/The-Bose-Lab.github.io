- title: PhD at Imperial
  text: PhD openings this year are for candidates able to secure funding through competitive scholarship
    schemes such as QRT labs, Thomson Reuters, or the President's PhD Scholarship. These schemes are highly
    competitive, which unfortunately often means a competitive CV requires 1–2 first-author publications at
    top-tier venues. Apply through the Department of Computing admissions portal and name Joey Bose as your
    preferred supervisor. Funded positions are announced on the News page and on social media.
- title: MSc & Undergraduate Projects
  text: We welcome MSc and undergraduate projects in generative models, geometry, and AI for science. Student
    application details will be announced here.
- title: Visitors & Interns
  text: The lab is not hosting interns from outside Imperial over the next year. We occasionally host visiting
    students; strong candidates typically have prior research experience in generative modelling or a closely
    related area.
- title: Research fit
  text: Please read two or three of our representative papers first.
