- title: PhD at Imperial
  text: Apply through the Department of Computing admissions portal and name Joey Bose as your preferred
    supervisor. Funded positions are announced on the News page and on social media.
- title: MSc & Undergraduate Projects
  text: We welcome MSc and undergraduate projects in generative models, geometry, and AI for science. Student
    application details will be announced here.
- title: Visitors & Interns
  text: We occasionally host visiting students and research interns. Strong candidates typically have prior
    research experience in generative modelling or a closely related area.
- title: Research fit
  text: Please read two or three of our representative papers first.
