- id: fast-cofolding
  title: Fast Cofolding and the Rewards That Guide It
  speaker: Joey Bose
  kind: In Silico (Pillar VC)
  when: November 2026
  abstract:
    - >-
      Cofolding models in the AlphaFold 3 family place every atom by denoising, over roughly two
      hundred network evaluations per structure. That cost shapes everything downstream, because
      inference-time search multiplies it by the number of particles and by every reward call. This
      talk covers two pieces of work: one on the cost of generation, the other on the reward that
      guides it.
    - >-
      DeCAF distils a pretrained all-atom cofolding model into a few-step flow map. Distilling Pearl
      gives a student that matches its teacher's success rate on Runs N' Poses with five times fewer
      network evaluations, and the flow map's look-ahead makes reward-guided search both cheaper and
      better aimed. MARTINI then addresses the reward itself. Given a small set of oracle values or
      rankings, it learns how several cheap surrogates combine and steers with those surrogates
      alone, with no oracle queries at inference. Fitted once to measured binding affinities, the
      composition improves joint pose accuracy on complexes released after the training cutoff.
  links:
    - label: DeCAF paper
      href: https://arxiv.org/abs/2606.08375
    - label: DeCAF code
      href: https://github.com/genesistherapeutics/decaf
    - label: DeCAF blog post
      href: https://www.genesis.ml/news/genesis-model-distillation
    - label: MARTINI paper
      href: https://arxiv.org/abs/2610.25502
    - label: MARTINI project page
      href: https://alecsargood.github.io/martini/
- id: learning-generative-maps
  title: Learning Generative Maps and the Rewards That Guide Them
  speaker: Joey Bose
  kind: Invited talk
  when: October 2026
  abstract:
    - >-
      Learning a generative model gives us a sampler for a data distribution. Adapting that sampler
      to a downstream task requires rewarding preferential outcomes typically in the form of scalar
      rewards or rankings that the model must internalize. In this talk, I will discuss learning
      generative maps as well as new methodology to exploit (multiple) rewards at inference used to
      guide them. I will first introduce Normalizing Flow Maps (NFM), a new generative modeling class
      which combines few-step generation with exact likelihood evaluation by learning invertible
      transport maps along a generative probability path. NFMs are centered around two matching
      principles: pointwise and distributional matching provide complementary training objectives,
      while access to sample densities enables direct likelihood-based post-training.
    - >-
      In the second part of the talk, I will focus on application domains where the objective of
      interest requires costly human judgments or experimental measurements such that the true oracle
      reward is unavailable at inference. However, aiding us in these settings are often cheaper reward
      surrogates that capture only parts of the desired oracle reward. I will introduce MARTINI, which
      uses limited oracle scores or rankings to learn a composition of these surrogates. The resulting
      reward can guide generation without further oracle queries. We characterize what information
      about the oracle can be recovered from the surrogates and, in the small-tilt regime, relate reward
      approximation error to the discrepancy between the desired and induced distributions. Examples
      from image generation and post-training, language steering, and molecular modeling will
      illustrate how the structure of the generative map and the information available about the
      reward determine the adaptations we can achieve.
  links:
    - label: Normalizing Flow Maps paper
      href: https://arxiv.org/abs/2610.22711
    - label: Normalizing Flow Maps blog post
      page: post
    - label: MARTINI paper
      href: https://arxiv.org/abs/2610.25502
    - label: MARTINI project page
      href: https://alecsargood.github.io/martini/
