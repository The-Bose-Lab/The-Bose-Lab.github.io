name: Build and check
on:
  push:
    branches: [main, codex/production-website-preview]
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/verify-release.mjs
      - run: SITE_BASE=/preview/ pnpm build
